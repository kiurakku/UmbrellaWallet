version: 2

# Desktop-only wallet. Security updates are raised immediately regardless of schedule.
updates:
  - package-ecosystem: nuget
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
      - security
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: "scope"
