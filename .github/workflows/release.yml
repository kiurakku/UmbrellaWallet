name: Release

# Build the desktop artifacts on their native runners and attach them to the GitHub Release
# for the pushed tag (e.g. v3.0.1). Windows: installer + portable zip. Linux: self-contained tarball.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Stage bundled Tor + Monero
        shell: pwsh
        run: |
          ./desktop/scripts/fetch-tor.ps1
          ./desktop/scripts/fetch-monero.ps1

      - name: Publish (app folder + portable single-file)
        shell: pwsh
        run: |
          $csproj = "desktop/src/Umbrella.Wallet.App/Umbrella.Wallet.App.csproj"
          dotnet publish $csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/app
          dotnet publish $csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/portable
          foreach ($d in "dist/app","dist/portable") { Rename-Item "$d/Umbrella.Wallet.App.exe" "Umbrella.exe" -Force }

      - name: Build installer (Inno Setup) + portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$(Resolve-Path dist/app)" "/DDistDir=$(Resolve-Path dist)" desktop/installer/umbrella.iss
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/UmbrellaWallet-Portable-${{ steps.v.outputs.version }}.zip" -Force

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UmbrellaWallet-Setup-${{ steps.v.outputs.version }}.exe
            dist/UmbrellaWallet-Portable-${{ steps.v.outputs.version }}.zip

  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version
        id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build self-contained Linux tarball
        run: |
          chmod +x desktop/scripts/publish-linux.sh
          ( cd desktop && ./scripts/publish-linux.sh )

      - name: Normalise artifact name
        run: |
          V="${{ steps.v.outputs.version }}"
          cp "desktop/dist/linux/umbrella-wallet-${V}-linux-x64.tar.gz" \
             "UmbrellaWallet-${V}-linux-x64.tar.gz"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: UmbrellaWallet-${{ steps.v.outputs.version }}-linux-x64.tar.gz

  checksums:
    name: checksums
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # Both build jobs have finished and attached their artifacts to the release; pull them all
      # back and produce ONE SHA256SUMS.txt so downloaders can verify every file.
      - name: Download all release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "UmbrellaWallet-*" --dir assets

      # Fail closed if the release is incomplete: every platform artifact for THIS version must be
      # present and version-stamped before we publish a checksum manifest — a partial release must
      # never yield a SHA256SUMS.txt that silently omits (or misnames) a file.
      - name: Verify the expected artifacts are all present
        run: |
          V="${{ steps.v.outputs.version }}"
          expected=(
            "UmbrellaWallet-Setup-${V}.exe"
            "UmbrellaWallet-Portable-${V}.zip"
            "UmbrellaWallet-${V}-linux-x64.tar.gz"
          )
          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "assets/$f" ]; then echo "::error::missing release artifact: $f"; missing=1; fi
          done
          # Reject any stray or wrong-version UmbrellaWallet-* asset so the manifest is exactly the set.
          for f in assets/UmbrellaWallet-*; do
            base="$(basename "$f")"
            keep=0
            for e in "${expected[@]}"; do [ "$base" = "$e" ] && keep=1; done
            if [ "$keep" -eq 0 ]; then echo "::error::unexpected artifact: $base"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Release artifact set is incomplete or unexpected."; exit 1; }

      - name: Generate and self-verify SHA256SUMS.txt
        run: |
          ( cd assets && sha256sum UmbrellaWallet-* ) > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"; cat SHA256SUMS.txt
          # Prove every line matches the attached file byte-for-byte before we publish it.
          ( cd assets && sha256sum -c ../SHA256SUMS.txt )

      - name: Attach checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
