name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore desktop/Umbrella.Wallet.sln
      - run: dotnet test desktop/Umbrella.Wallet.sln --no-restore --verbosity minimal
      - run: dotnet build desktop/Umbrella.Wallet.sln --no-restore -c Release
